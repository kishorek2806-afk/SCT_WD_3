<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Interactive Quiz Game</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">

  <div class="container my-5 p-4 bg-white shadow rounded">
    <h1 class="text-center mb-4">Interactive Quiz Game</h1>

    <form id="quizForm">
      <!-- Questions will be inserted here -->
    </form>

    <div class="d-grid mt-4">
      <button id="submitBtn" class="btn btn-primary btn-lg">Submit Answers</button>
    </div>

    <div id="result" class="alert alert-info mt-4 text-center d-none"></div>
  </div>

  <!-- Bootstrap JS (with Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const quizQuestions = [
      {
        type: "single",
        question: "What is the capital of Italy?",
        options: ["Paris", "Rome", "Berlin", "Madrid"],
        correct: ["Rome"]
      },
      {
        type: "multiple",
        question: "Select all fruits:",
        options: ["Apple", "Carrot", "Banana", "Potato"],
        correct: ["Apple", "Banana"]
      },
      {
        type: "fill",
        question: "Fill in the blank: The chemical symbol for gold is ___.",
        correct: ["Au"]
      },
      {
        type: "truefalse",
        question: "The Earth is flat.",
        options: ["True", "False"],
        correct: ["False"]
      },
      {
        type: "single",
        question: "Which language runs in a web browser?",
        options: ["Python", "JavaScript", "C++", "Java"],
        correct: ["JavaScript"]
      }
    ];

    const quizForm = document.getElementById("quizForm");
    const submitBtn = document.getElementById("submitBtn");
    const resultDiv = document.getElementById("result");

    // Render quiz
    function renderQuiz() {
      quizQuestions.forEach((q, idx) => {
        const container = document.createElement("div");
        container.className = "mb-4";

        let html = `<h5>Q${idx + 1}. ${q.question}</h5>`;

        if (q.type === "single" || q.type === "truefalse") {
          q.options.forEach(opt => {
            html += `
              <div class="form-check">
                <input class="form-check-input" type="radio" name="q${idx}" value="${opt}" required>
                <label class="form-check-label">${opt}</label>
              </div>
            `;
          });
        } else if (q.type === "multiple") {
          q.options.forEach(opt => {
            html += `
              <div class="form-check">
                <input class="form-check-input" type="checkbox" name="q${idx}" value="${opt}">
                <label class="form-check-label">${opt}</label>
              </div>
            `;
          });
        } else if (q.type === "fill") {
          html += `
            <input type="text" class="form-control mt-2" name="q${idx}" placeholder="Your answer here" required>
          `;
        }

        container.innerHTML = html;
        quizForm.appendChild(container);
      });
    }

    // Score calculator
    function calculateScore() {
      let score = 0;
      quizQuestions.forEach((q, idx) => {
        if (q.type === "single" || q.type === "truefalse") {
          const answer = quizForm[`q${idx}`].value;
          if (q.correct.includes(answer)) {
            score++;
          }
        } else if (q.type === "multiple") {
          const checkedEls = quizForm.querySelectorAll(`input[name="q${idx}"]:checked`);
          const selected = Array.from(checkedEls).map(el => el.value);

          const correctSet = new Set(q.correct);
          const selectedSet = new Set(selected);

          const allCorrect = q.correct.every(ans => selectedSet.has(ans));
          const noIncorrect = selected.every(ans => correctSet.has(ans));

          if (allCorrect && noIncorrect && selected.length > 0) {
            score++;
          }
        } else if (q.type === "fill") {
          const answer = quizForm[`q${idx}`].value.trim().toLowerCase();
          const correct = q.correct.map(ans => ans.toLowerCase());
          if (correct.includes(answer)) {
            score++;
          }
        }
      });
      return score;
    }

    submitBtn.addEventListener("click", (e) => {
      e.preventDefault();

      if (!quizForm.reportValidity()) {
        alert("Please answer all questions.");
        return;
      }

      const score = calculateScore();
      resultDiv.textContent = `You scored ${score} out of ${quizQuestions.length}!`;
      resultDiv.classList.remove("d-none");

      [...quizForm.elements].forEach(el => el.disabled = true);
      submitBtn.disabled = true;
    });

    // Initialize quiz
    renderQuiz();
  </script>
</body>
</html>
